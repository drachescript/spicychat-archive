name: Migrate archive to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_R2_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_R2_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" || { echo "Missing CLOUDFLARE_R2_ACCESS_KEY_ID"; exit 1; }
          test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY" || { echo "Missing CLOUDFLARE_R2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify R2 free-tier headroom before migration
        run: python scripts/r2_guard.py --migration-check --status-file data/r2-usage.json

      - name: Check for completed R2 migration
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import os
          import archive
          from storage_r2 import R2ArchiveStore

          config = archive.load_config()
          store = R2ArchiveStore(config)
          completed = store.is_migrated()
          print(f"R2 migration marker present: {completed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"completed={'true' if completed else 'false'}\n")
          PY

      - name: Upload current archive and prune Git copies
        if: steps.migration.outputs.completed != 'true'
        run: python scripts/r2_safe_runner.py migrate_r2.py --prune-local --summary-file "$RUNNER_TEMP/r2-migration-summary.md"

      - name: Finalize already-completed R2 migration
        if: steps.migration.outputs.completed == 'true'
        run: python scripts/finalize_r2_migration.py --prune-local --summary-file "$RUNNER_TEMP/r2-migration-summary.md"

      # Commit the authoritative switch immediately after migration/finalization.
      # A later smoke-test failure must not strand the successful R2 migration
      # only inside a disposable Actions runner again.
      - name: Commit R2 migration cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- archive data fallback config.json 2>/dev/null || true
          git add -A -- media 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Git-side migration changes."
            exit 0
          fi
          git commit -m "Move archive storage to Cloudflare R2"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
          done

      - name: Run short R2 smoke test
        timeout-minutes: 5
        run: python scripts/r2_smoke_test.py --summary-file "$RUNNER_TEMP/r2-smoke-summary.md"

      - name: Test archive code
        timeout-minutes: 10
        run: python -m unittest discover -s tests -v

      - name: Add run summary
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/r2-migration-summary.md" ] || cat "$RUNNER_TEMP/r2-migration-summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f "$RUNNER_TEMP/r2-smoke-summary.md" ] || cat "$RUNNER_TEMP/r2-smoke-summary.md" >> "$GITHUB_STEP_SUMMARY"
