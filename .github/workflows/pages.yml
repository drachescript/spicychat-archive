name: Deploy archive website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "assets/**"
      - "bot/**"
      - "bots/**"
      - "deleted/**"
      - "deleted-lorebooks/**"
      - "deleted-rulebooks/**"
      - "lorebook/**"
      - "lorebooks/**"
      - "rulebook/**"
      - "rulebooks/**"
      - "recovery/**"
      - "merge/**"
      - "name-trends/**"
      - "tag-stats/**"
      - "creator/**"
      - "changes/**"
      - "activity/**"
      - "search/**"
      - "explorer/**"
      - "restored/**"
      - "flagged/**"
      - "inconclusive/**"
      - "health/**"
      - "stats/**"
      - "faq/**"
      - "admin/**"
      - "data/**"
      - "tags.json"
      - "blocked-words.json"
      - "rulebook-tags.json"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # GITHUB_TOKEN pushes from crawler/stat workflows do not fire push workflows.
  # Rebuild the public feed after those workflows finish, including failed runs
  # that published a failure event for the Discord archive notifier.
  workflow_run:
    workflows:
      - "Update SpicyChat archive"
      - "Build Archive name, title and tag stats"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish only the current main branch.
          ref: main
          fetch-depth: 1

      - uses: actions/configure-pages@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pages-site"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          # Keep this explicit so workflows, tests and private archive files are
          # not accidentally published. Include *all* public route directories.
          cp -a index.html favicon.svg assets bot bots deleted deleted-lorebooks deleted-rulebooks lorebook lorebooks rulebook rulebooks recovery merge name-trends tag-stats creator changes activity search explorer restored flagged inconclusive health stats faq admin data tags.json blocked-words.json rulebook-tags.json CNAME .nojekyll "$OUT/"

          # In R2 mode, bot detail JSON and media live in R2. Old generated Git
          # copies can still exist in checkout until the cleanup commit lands, so
          # explicitly keep them out of the Pages artifact.
          if python - <<'PY_CHECK'
          import json
          from pathlib import Path
          p=Path('data/runtime.json')
          raise SystemExit(0 if p.exists() and json.loads(p.read_text()).get('storageMode') == 'r2' else 1)
          PY_CHECK
          then
            rm -rf "$OUT/data/bots" "$OUT/data/catalog" "$OUT/media"
          else
            # Pre-migration/local mode fallback.
            mkdir -p "$OUT/data/bots"
            if [ -d archive/bots ]; then
              find archive/bots -type f -name '*.json' -exec cp {} "$OUT/data/bots/" \;
            fi
            if [ -d archive/media ]; then
              mkdir -p "$OUT/media"
              cp -a archive/media/. "$OUT/media/"
            elif [ -d media ]; then
              cp -a media "$OUT/"
            fi
          fi

      - name: Verify required Pages routes before publishing
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pages-site"
          python - "$OUT" <<'PY_VERIFY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          required = [
              'index.html', 'bot/index.html', 'deleted/index.html',
              'deleted-lorebooks/index.html', 'deleted-rulebooks/index.html',
              'lorebook/index.html', 'lorebooks/index.html',
              'rulebook/index.html', 'rulebooks/index.html',
              'rulebook-tags.json', 'recovery/index.html',
              'merge/index.html', 'name-trends/index.html',
              'tag-stats/index.html', 'creator/index.html',
              'changes/index.html', 'stats/index.html', 'faq/index.html',
              'flagged/index.html', 'assets/flagged.js', 'assets/flagged-rules.js',
              'inconclusive/index.html', 'assets/inconclusive.js',
              'assets/inconclusive-records.js',
              'data/inconclusive.json', 'data/inconclusive-corrections.json',
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit('Pages artifact missing required routes: ' + ', '.join(missing))
          if (root / 'CNAME').read_text().strip() != 'spicychatarchive.drache.uk':
              raise SystemExit('Missing or unexpected custom domain in Pages artifact')
          print(f'Pages artifact verified: {len(required)} required routes and CNAME present')
          PY_VERIFY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
