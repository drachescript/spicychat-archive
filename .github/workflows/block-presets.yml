name: Discover Archive blocking preset candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/block-presets/**"
      - "scripts/publish_block_presets.py"
      - "tests/test_block_presets.py"
      - ".github/workflows/block-presets.yml"
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false
  queue: max

jobs:
  block-presets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run preset regression tests
        run: |
          python -m unittest discover -s tests -p test_block_presets.py -v
          node --test --experimental-default-type=module tests/block-presets.test.mjs
      - name: Check free-tier R2 quota guard
        id: guard
        run: python scripts/r2_guard_adaptive.py --github-output "$GITHUB_OUTPUT" --status-file "$RUNNER_TEMP/block-presets-usage.json"
      - name: Update public candidate statistics (not active blocking rules)
        if: steps.guard.outputs.mode == 'r2'
        run: python scripts/publish_block_presets.py
      - name: Explain quota pause
        if: steps.guard.outputs.mode != 'r2'
        run: echo "Preset candidate discovery unchanged due to R2 quota guard." >> "$GITHUB_STEP_SUMMARY"
