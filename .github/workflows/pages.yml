name: Deploy archive website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "assets/**"
      - "bot/**"
      - "deleted/**"
      - "creator/**"
      - "changes/**"
      - "activity/**"
      - "explorer/**"
      - "restored/**"
      - "health/**"
      - "stats/**"
      - "faq/**"
      - "admin/**"
      - "data/**"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pages-site"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a index.html favicon.svg assets bot deleted creator changes activity explorer restored health stats faq admin data CNAME .nojekyll "$OUT/"

          # In R2 mode, bot detail JSON and media live in R2. Old generated Git
          # copies can still exist in checkout until the cleanup commit lands, so
          # explicitly keep them out of the Pages artifact.
          if python - <<'PY_CHECK'
          import json
          from pathlib import Path
          p=Path('data/runtime.json')
          raise SystemExit(0 if p.exists() and json.loads(p.read_text()).get('storageMode') == 'r2' else 1)
          PY_CHECK
          then
            rm -rf "$OUT/data/bots" "$OUT/data/catalog" "$OUT/media"
          else
            # Pre-migration/local mode fallback.
            mkdir -p "$OUT/data/bots"
            if [ -d archive/bots ]; then
              find archive/bots -type f -name '*.json' -exec cp {} "$OUT/data/bots/" \;
            fi
            if [ -d archive/media ]; then
              mkdir -p "$OUT/media"
              cp -a archive/media/. "$OUT/media/"
            elif [ -d media ]; then
              cp -a media "$OUT/"
            fi
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
