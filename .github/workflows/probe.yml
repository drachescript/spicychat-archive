name: Probe SpicyChat public APIs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run non-destructive probe
        run: python scripts/probe.py --output probe-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: spicychat-probe-report
          path: probe-report.json
