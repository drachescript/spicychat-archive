name: Cleanup old archive branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-old-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove merged archive work branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            archive-maintenance-mode
            fix-1000-page-timeout-reporting
            archive-batch-2026-09-29
            archive-search-500
            archive-shards-100-pages
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "$branch is already gone"
            fi
          done
