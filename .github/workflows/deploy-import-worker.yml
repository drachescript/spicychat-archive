name: Deploy Bot Status import endpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "scripts/rich_field_index.py"
      - "scripts/site_indexes.py"
      - "scripts/archive_cloud.py"
      - "scripts/import_bot_status.py"
      - ".github/workflows/deploy-import-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      IMPORT_TOKEN: ${{ secrets.SPICYCHAT_ARCHIVE_IMPORT_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check import token
        shell: bash
        run: |
          if [ -z "${IMPORT_TOKEN:-}" ]; then
            echo "Missing repository secret SPICYCHAT_ARCHIVE_IMPORT_TOKEN"
            exit 1
          fi

      - name: Deploy upload worker
        run: npx --yes wrangler@4 deploy --config worker/wrangler.toml

      - name: Set private upload token
        shell: bash
        run: printf '%s' "$IMPORT_TOKEN" | npx --yes wrangler@4 secret put IMPORT_TOKEN --config worker/wrangler.toml

      - name: Build archive indexes if needed
        shell: bash
        run: |
          python -m pip install --quiet boto3
          python scripts/rich_field_index.py --rebuild-if-missing
          python scripts/site_indexes.py --rebuild-if-missing
