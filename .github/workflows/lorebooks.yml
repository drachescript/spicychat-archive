name: Update SpicyChat Lorebook archive

on:
  workflow_dispatch:
  schedule:
    # Roughly every 5 hours. The shared spicychat-archive-writer concurrency
    # group queues this behind any active bot archive/R2 writer, so the two
    # archive crawlers never run at the same time.
    - cron: "17 */5 * * *"

permissions:
  contents: read

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  lorebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check R2 free-tier guard
        id: r2guard
        run: python scripts/r2_guard_adaptive.py --github-output "$GITHUB_OUTPUT" --status-file data/r2-usage.json

      - name: Update Lorebook archive in R2
        if: steps.r2guard.outputs.mode == 'r2'
        run: python scripts/lorebook_archive.py

      - name: Verify public Lorebook index
        if: steps.r2guard.outputs.mode == 'r2'
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests

          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          base = str(config["storage"]["r2"]["public_base_url"]).rstrip("/")
          url = f"{base}/indexes/lorebooks.json?verify={int(time.time())}"
          response = requests.get(url, timeout=30)
          response.raise_for_status()
          payload = response.json()
          total = int(payload.get("totalArchived") or 0)
          if total < 1:
              raise SystemExit("Public Lorebook index loaded but contained no archived Lorebooks.")
          print(f"Public Lorebook index verified: {total:,} archived Lorebooks.")
          PY

      - name: Test Lorebook archive code
        run: python -m unittest tests.test_lorebook_archive -v
