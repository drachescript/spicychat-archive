name: Migrate archive to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_R2_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_R2_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" || { echo "Missing CLOUDFLARE_R2_ACCESS_KEY_ID"; exit 1; }
          test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY" || { echo "Missing CLOUDFLARE_R2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify R2 free-tier headroom before migration
        run: python scripts/r2_guard.py --migration-check --status-file data/r2-usage.json

      - name: Upload current archive and prune Git copies
        run: python scripts/migrate_r2.py --prune-local --summary-file "$RUNNER_TEMP/r2-migration-summary.md"

      - name: Run one R2-backed archive scan
        env:
          SPICYCHAT_ARCHIVE_EXPLORE_PAGES: "4"
          SPICYCHAT_ARCHIVE_DISABLE_IMAGES: "true"
        run: python scripts/archive_cloud.py --summary-file "$RUNNER_TEMP/archive-summary.md"

      - name: Test archive code
        run: python -m unittest discover -s tests -v

      - name: Add run summary
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/r2-migration-summary.md" ] || cat "$RUNNER_TEMP/r2-migration-summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f "$RUNNER_TEMP/archive-summary.md" ] || cat "$RUNNER_TEMP/archive-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit R2 migration cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- archive data fallback config.json 2>/dev/null || true
          git add -A -- media 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Git-side migration changes."
            exit 0
          fi
          git commit -m "Move archive storage to Cloudflare R2"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
          done
