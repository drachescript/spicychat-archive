name: Remove verified metadata-only Rulebook files

on:
  push:
    branches: [main]
    paths:
      - "scripts/prune_rulebook_listing_only.py"
      - ".github/workflows/prune-rulebook-listing-only.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete verified metadata-only Rulebook files (otherwise dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test non-destructive guards
        run: python -m unittest tests.test_prune_rulebook_listing_only -v
      - name: Check R2 safety guard
        id: r2guard
        run: python scripts/r2_guard_adaptive.py --github-output "$GITHUB_OUTPUT" --status-file data/r2-usage.json
      - name: Prune verified listing-only JSON files (one-time)
        if: steps.r2guard.outputs.mode == 'r2'
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.apply }}" == "true" ]]; then
            ARGS+=(--apply)
          fi
          python scripts/prune_rulebook_listing_only.py "${ARGS[@]}" --max-objects 800
      - name: Explain paused operation
        if: steps.r2guard.outputs.mode != 'r2'
        run: echo "R2 safety guard paused cleanup; no objects deleted."
