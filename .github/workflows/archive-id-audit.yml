name: Audit Archive bot IDs and stored files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_discovery_ids.py"
      - ".github/workflows/archive-id-audit.yml"
  schedule:
    # Weekly non-destructive inventory; no million-request per-ID HEAD sweep.
    - cron: "39 6 * * 1"

permissions:
  contents: read

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  per-id-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check R2 free-tier guard
        id: guard
        run: python scripts/r2_guard_adaptive.py --github-output "$GITHUB_OUTPUT" --status-file "$RUNNER_TEMP/archive-id-audit-usage.json"
      - name: Compare every discovered ID with search indexes and actual R2 bot JSON keys
        if: steps.guard.outputs.mode == 'r2'
        run: |
          python scripts/audit_discovery_ids.py --max-list-pages 2000 | tee "$RUNNER_TEMP/archive-id-audit.log"
          {
            echo "## Archive bot-object inventory"
            echo ""
            echo "This is a complete, read-only comparison of saved discovery IDs, search-index IDs, and stored bot JSON objects. It does not verify live SpicyChat status."
            echo ""
            tail -n 1 "$RUNNER_TEMP/archive-id-audit.log"
            echo ""
            echo "Public report: https://data.spicychatarchive.drache.uk/indexes/discovery-id-audit.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Explain quota pause
        if: steps.guard.outputs.mode != 'r2'
        run: echo "Per-ID inventory skipped because the R2 quota guard is paused. No old report was replaced." >> "$GITHUB_STEP_SUMMARY"
