name: Fix partial Typesense paging

on:
  push:
    paths:
      - .github/workflows/fix-partial-typesense-paging.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Patch deep discovery pagination and add regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/r2_archive_optimized.py')
          text = path.read_text(encoding='utf-8')

          marker = "_run_started_monotonic = 0.0\n\n\n"
          helper = '''def _typesense_page_has_more(\n    found: Any,\n    *,\n    page: int,\n    per_page: int,\n    received: int,\n) -> bool:\n    \"\"\"Return True when Typesense reports rows beyond this page response.\"\"\"\n    try:\n        total = int(found)\n        page = max(1, int(page))\n        per_page = max(1, int(per_page))\n        received = max(0, int(received))\n    except (TypeError, ValueError):\n        return False\n\n    consumed = (page - 1) * per_page + received\n    return total > consumed\n\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('helper insertion marker not found')
              text = text.replace(marker, marker + helper, 1)

          old_empty = '''            if not hits:\n                if (\n                    mode == \"page\"\n                    and found\n                    and (int(exploration.get(\"page\") or 1) - 1)\n                    * page_size\n                    < found\n                ):\n                    exploration[\"blockedAtResultCap\"] = True\n                    cursor = exploration.get(\"lastCreatedAt\")\n                    if cursor is not None:\n                        mode = exploration[\"mode\"] = \"cursor\"\n                        exploration[\"cursorCreatedAt\"] = cursor\n                        continue\n\n                missing_queued += finish_exploration_pass(at)\n'''
          new_empty = '''            if not hits:\n                page_no = int(request.get(\"page\") or exploration.get(\"page\") or 1)\n                capped = (\n                    mode == \"page\"\n                    and _typesense_page_has_more(\n                        found,\n                        page=page_no,\n                        per_page=int(request.get(\"per_page\") or page_size),\n                        received=0,\n                    )\n                )\n                if capped:\n                    exploration[\"blockedAtResultCap\"] = True\n                    cursor = exploration.get(\"lastCreatedAt\")\n                    if cursor is None:\n                        errors.append(\n                            \"Typesense page-mode result cap was reached, but no \"\n                            \"createdAt cursor is available to continue safely\"\n                        )\n                        break\n                    mode = exploration[\"mode\"] = \"cursor\"\n                    exploration[\"cursorCreatedAt\"] = cursor\n                    print(\n                        f\"explore: page {page_no} returned no hits while Typesense \"\n                        \"still reports more results; switching to createdAt cursor mode.\",\n                        flush=True,\n                    )\n                    continue\n\n                missing_queued += finish_exploration_pass(at)\n'''
          if old_empty not in text:
              raise SystemExit('empty-page result-cap block not found')
          text = text.replace(old_empty, new_empty, 1)

          old_partial = '''            if len(hits) < page_size:\n                missing_queued += finish_exploration_pass(at)\n                exploration[\"pass\"] = int(exploration.get(\"pass\") or 0) + 1\n                exploration[\"page\"] = 1\n                exploration[\"mode\"] = mode = \"page\"\n                exploration[\"cursorCreatedAt\"] = None\n                exploration[\"lastCreatedAt\"] = None\n                break\n'''
          new_partial = '''            if len(hits) < page_size:\n                page_no = int(request.get(\"page\") or 1)\n                capped = (\n                    mode == \"page\"\n                    and _typesense_page_has_more(\n                        found,\n                        page=page_no,\n                        per_page=int(request.get(\"per_page\") or page_size),\n                        received=len(hits),\n                    )\n                )\n                if capped:\n                    exploration[\"blockedAtResultCap\"] = True\n                    if last_created is None:\n                        errors.append(\n                            \"Typesense returned a partial capped page without a \"\n                            \"createdAt value to continue safely\"\n                        )\n                        break\n                    mode = exploration[\"mode\"] = \"cursor\"\n                    exploration[\"cursorCreatedAt\"] = last_created\n                    print(\n                        f\"explore: page {page_no} returned a partial {len(hits):,}/\"\n                        f\"{int(request.get('per_page') or page_size):,} page while \"\n                        f\"Typesense reports {int(found or 0):,} total results; \"\n                        \"switching to createdAt cursor mode instead of treating it \"\n                        \"as the end of the catalog.\",\n                        flush=True,\n                    )\n                    continue\n\n                missing_queued += finish_exploration_pass(at)\n                exploration[\"pass\"] = int(exploration.get(\"pass\") or 0) + 1\n                exploration[\"page\"] = 1\n                exploration[\"mode\"] = mode = \"page\"\n                exploration[\"cursorCreatedAt\"] = None\n                exploration[\"lastCreatedAt\"] = None\n                break\n'''
          if old_partial not in text:
              raise SystemExit('partial-page natural-end block not found')
          text = text.replace(old_partial, new_partial, 1)

          path.write_text(text, encoding='utf-8')

          Path('tests/test_typesense_paging.py').write_text('''import unittest\n\nfrom r2_archive_optimized import _typesense_page_has_more\n\n\nclass TypesensePagingTests(unittest.TestCase):\n    def test_partial_page_with_reported_rows_remaining_is_not_natural_end(self):\n        self.assertTrue(\n            _typesense_page_has_more(\n                1_392_525, page=169, per_page=250, received=188\n            )\n        )\n\n    def test_true_final_partial_page_is_natural_end(self):\n        self.assertFalse(\n            _typesense_page_has_more(\n                42_188, page=169, per_page=250, received=188\n            )\n        )\n\n    def test_empty_page_before_reported_end_still_has_more(self):\n        self.assertTrue(\n            _typesense_page_has_more(\n                1_392_525, page=170, per_page=250, received=0\n            )\n        )\n\n\nif __name__ == '__main__':\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-partial-typesense-paging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/r2_archive_optimized.py tests/test_typesense_paging.py .github/workflows/fix-partial-typesense-paging.yml
          git commit -m "Handle Typesense partial-page result caps"
          git pull --rebase origin main
          git push origin HEAD:main
