name: Update SpicyChat archive

on:
  workflow_dispatch:
    inputs:
      discovery_pages:
        description: "Deep Typesense sweep pages for this manual run"
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "250"
          - "500"
          - "750"
          - "1000"
  schedule:
    - cron: "37 */3 * * *"
  workflow_run:
    workflows: ["Probe SpicyChat public APIs"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Empty for scheduled/probe-triggered runs. Manual runs can explicitly ask
      # for a larger deep sweep without changing the normal 100-page target.
      SPICYCHAT_ARCHIVE_MANUAL_PAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.discovery_pages || '' }}
      # Materialized bot writes remain parallel. Page-mode Typesense discovery can
      # prefetch up to eight consecutive pages per native multi_search request.
      SPICYCHAT_ARCHIVE_R2_WRITE_WORKERS: "8"
      SPICYCHAT_ARCHIVE_TYPESENSE_BATCH_SIZE: "8"
      # Two consecutive discovery pages share one shard/journal checkpoint. This
      # halves the expensive per-page R2 checkpoint count while keeping shards
      # small enough for fast detail-page fallback reads.
      SPICYCHAT_ARCHIVE_DISCOVERY_FLUSH_PAGES: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check R2 free-tier guard
        id: r2guard
        run: python scripts/r2_guard_adaptive.py --github-output "$GITHUB_OUTPUT" --status-file data/r2-usage.json

      - name: Replay pending Git fallback into R2
        if: steps.r2guard.outputs.mode == 'r2' && steps.r2guard.outputs.replay_write_budget != '0'
        run: python scripts/r2_safe_runner.py replay_fallback.py --max-writes "${{ steps.r2guard.outputs.replay_write_budget }}" --summary-file "$RUNNER_TEMP/replay-summary.md"

      - name: Analyze pending public Bot Status submissions
        if: steps.r2guard.outputs.mode == 'r2'
        run: python scripts/review_bot_status_submissions.py --summary-file "$RUNNER_TEMP/public-submission-summary.md"

      - name: Import queued Bot Status Center exports
        if: steps.r2guard.outputs.mode == 'r2'
        run: python scripts/r2_accel_runner.py import --inbox --summary-file "$RUNNER_TEMP/bot-status-import-summary.md"

      - name: Update archive in R2
        id: archive
        if: steps.r2guard.outputs.mode == 'r2'
        continue-on-error: true
        env:
          # The guard can always lower the requested target. Scheduled runs now
          # keep a 100-page deep sweep; manual runs may request up to 1000.
          SPICYCHAT_ARCHIVE_EXPLORE_GUARD_CAP: ${{ steps.r2guard.outputs.explore_pages }}
          SPICYCHAT_ARCHIVE_DISABLE_IMAGES: ${{ steps.r2guard.outputs.disable_images }}
        run: python scripts/r2_accel_runner.py archive --summary-file "$RUNNER_TEMP/archive-summary.md"

      - name: Publish archive run feed
        if: always() && steps.r2guard.outputs.mode == 'r2' && steps.archive.outcome != 'skipped'
        env:
          ARCHIVE_RUN_STATUS: ${{ steps.archive.outcome }}
          ARCHIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/publish_run_feed.py

      - name: Publish real public-index growth
        if: always() && steps.r2guard.outputs.mode == 'r2' && steps.archive.outcome != 'skipped'
        run: python scripts/public_growth.py

      - name: Update pre-migration local archive
        if: steps.r2guard.outputs.mode == 'legacy'
        run: python scripts/r2_safe_runner.py archive_cloud.py --summary-file "$RUNNER_TEMP/archive-summary.md"

      - name: Update compact Git fallback journal
        if: steps.r2guard.outputs.mode == 'github'
        run: python scripts/archive_fallback.py --summary-file "$RUNNER_TEMP/archive-summary.md"

      - name: Test archive code
        run: python -m unittest discover -s tests -v

      - name: Add run summary
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/replay-summary.md" ] || cat "$RUNNER_TEMP/replay-summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f "$RUNNER_TEMP/public-submission-summary.md" ] || cat "$RUNNER_TEMP/public-submission-summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f "$RUNNER_TEMP/bot-status-import-summary.md" ] || cat "$RUNNER_TEMP/bot-status-import-summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f "$RUNNER_TEMP/archive-summary.md" ] || cat "$RUNNER_TEMP/archive-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit public stats/runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_publish_files() {
            git add -A -- archive data config.json
            for path in fallback media; do
              if [ -e "$path" ] || git ls-files -- "$path" | grep -q .; then
                git add -A -- "$path"
              fi
            done
          }

          # Snapshot only files this run actually changed. A long crawler run can
          # overlap a human/code commit to main; rebasing generated JSON then can
          # conflict even though the crawl itself succeeded.
          stage_publish_files
          if git diff --cached --quiet; then
            echo "No Git-side archive changes to commit."
            exit 0
          fi

          snapshot="$RUNNER_TEMP/archive-publish-snapshot"
          changed="$RUNNER_TEMP/archive-publish-changed"
          deleted="$RUNNER_TEMP/archive-publish-deleted"
          rm -rf "$snapshot"
          mkdir -p "$snapshot/files"

          git diff --cached --name-only --diff-filter=ACMRTUXB -z > "$changed"
          git diff --cached --name-only --diff-filter=D -z > "$deleted"

          while IFS= read -r -d '' file; do
            mkdir -p "$snapshot/files/$(dirname "$file")"
            cp -a -- "$file" "$snapshot/files/$file"
          done < "$changed"

          # Publish the snapshot on top of the newest main instead of rebasing a
          # stale generated-data commit. This preserves newer code/docs while the
          # completed run remains authoritative for the runtime files it changed.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp -a "$snapshot/files/." .
            while IFS= read -r -d '' file; do
              rm -f -- "$file"
            done < "$deleted"

            stage_publish_files
            if git diff --cached --quiet; then
              echo "Newest main already contains this archive result."
              exit 0
            fi

            git commit -m "Update SpicyChat archive"
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "main kept changing; archive result publish failed after 5 race-safe attempts."
              exit 1
            fi
            echo "main changed during publish; applying the same archive snapshot to the new tip and retrying..."
            sleep $((attempt * 2))
          done

      - name: Fail workflow if archive crawler failed
        if: always() && steps.archive.outcome == 'failure'
        run: |
          echo "Archive crawler failed; failure event was published before marking this workflow failed."
          exit 1
