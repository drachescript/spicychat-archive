name: Retry archive card UX patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-archive-card-ux.yml"

permissions:
  contents: write

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply the reviewed patch from the first workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/patch-archive-card-ux.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Syntax-check site and worker"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch_code = textwrap.dedent(source[start:end])
          exec(compile(patch_code, 'archive-card-ux-patch', 'exec'))
          PY

      - name: Syntax-check site and worker
        run: |
          node --check assets/app.js
          node --check worker/src/index.js

      - name: Run archive tests
        run: python -m unittest discover -s tests -v

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/app.js assets/archive.css worker/src/index.js
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "Improve archive cards, paging and translations"
          git push origin HEAD:main
