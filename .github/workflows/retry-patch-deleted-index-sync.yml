name: Retry deleted index repair

on:
  push:
    paths:
      - ".github/workflows/retry-patch-deleted-index-sync.yml"

permissions:
  contents: write

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fix patch workflow and retire this helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-deleted-index-sync.yml')
          text = p.read_text(encoding='utf-8')
          old = '          end = storage.index("\\n    def ", start + 5)\n'
          new = '          next_def = storage.find("\\n    def ", start + 5)\n          end = next_def if next_def >= 0 else len(storage)\n'
          if old not in text:
              raise SystemExit('target line not found in patch workflow')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/retry-patch-deleted-index-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix deleted-index patch workflow EOF handling"
          git push origin HEAD:main
