name: Deploy archive website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "bot/**"
      - "deleted/**"
      - "data/**"
      - "media/**"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pages-site"
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp -a index.html assets bot deleted data media CNAME .nojekyll "$RUNNER_TEMP/pages-site/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
