name: Patch deleted index sync

on:
  push:
    paths:
      - ".github/workflows/patch-deleted-index-sync.yml"

permissions:
  contents: write

concurrency:
  group: spicychat-archive-writer
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Patch archive code and defaults
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          cfg_path = Path("config.json")
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          cfg["crawler"]["explore_pages_per_run"] = 100
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          workflow_path = Path(".github/workflows/archive.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace('        default: "50"\n        type: choice', '        default: "100"\n        type: choice', 1)
          workflow = workflow.replace('normal 50-page target.', 'normal 100-page target.')
          workflow = workflow.replace('keep a small 50-page deep sweep; manual runs may request up to 1000.', 'keep a 100-page deep sweep; manual runs may request up to 1000.')
          workflow_path.write_text(workflow, encoding="utf-8")

          storage_path = Path("scripts/storage_r2.py")
          storage = storage_path.read_text(encoding="utf-8")
          start = storage.index("    def publish_deleted_index(self, *, force: bool = False) -> str | None:\n")
          end = storage.index("\n    def ", start + 5)
          new_lines = [
              "    def publish_deleted_index(self, *, force: bool = False) -> str | None:",
              "        key = self.key(\"indexes\", \"deleted.json\")",
              "        rows = list(self.deleted_index.values())",
              "        rows.sort(key=lambda x: str(x.get(\"statusSince\") or \"\"), reverse=True)",
              "",
              "        # Keep the tiny public copy synchronized with the authoritative",
              "        # private deleted index even after an interrupted/stale publish.",
              "        try:",
              "            current = self.get_json(key, None)",
              "        except Exception:",
              "            current = None",
              "        current_rows = current.get(\"bots\") if isinstance(current, dict) else None",
              "        if force or self.deleted_dirty or current_rows != rows:",
              "            # Deleted counts should update immediately; do not edge-cache this index.",
              "            self.put_json(key, {\"bots\": rows}, public=False)",
              "",
              "        url = self.public_url(key)",
              "        if not url:",
              "            return None",
              "        revision = hashlib.blake2b(",
              "            json.dumps(rows, ensure_ascii=False, sort_keys=True, separators=(\",\", \":\")).encode(\"utf-8\"),",
              "            digest_size=8,",
              "        ).hexdigest()",
              "        return f\"{url}?v={revision}\"",
              "",
          ]
          storage = storage[:start] + "\n".join(new_lines) + storage[end:]
          storage_path.write_text(storage, encoding="utf-8")

          replace_once(
              "assets/app.js",
              "  deletedIndexUrl:'https://data.spicychatarchive.drache.uk/_meta/deleted-index.json',",
              "  deletedIndexUrl:'https://data.spicychatarchive.drache.uk/indexes/deleted.json',",
          )
          replace_once(
              "assets/app.js",
              "  let bots=[];if(runtime.deletedIndexUrl){try{bots=(await fetchJson(runtime.deletedIndexUrl)).bots||[];}catch{}}",
              "  let bots=[];\n  if(runtime.deletedIndexUrl){\n    try{\n      const payload=await fetchJson(runtime.deletedIndexUrl);\n      if(Array.isArray(payload?.bots))bots=payload.bots;\n      else if(payload&&typeof payload==='object')bots=Object.values(payload).filter(row=>row&&typeof row==='object');\n    }catch{}\n  }",
          )
          replace_once(
              "assets/app.js",
              "count.textContent=`${rows.length.toLocaleString()} shown`;",
              "const totalConfirmed=Math.max(bots.length,Number(stats?.deletedBots)||0);count.textContent=rows.length===totalConfirmed?`${rows.length.toLocaleString()} shown`:`${rows.length.toLocaleString()} shown · ${totalConfirmed.toLocaleString()} confirmed total`;",
          )

          stats_path = Path("data/stats.json")
          if stats_path.exists():
              stats = json.loads(stats_path.read_text(encoding="utf-8"))
              adaptive = stats.setdefault("adaptiveDiscovery", {})
              adaptive["basePages"] = 100
              adaptive["nextPageBudget"] = 100
              stats_path.write_text(json.dumps(stats, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Test archive code
        run: python -m unittest discover -s tests -v

      - name: Repair current public deleted index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import archive
          from storage_r2 import R2ArchiveStore

          config = archive.load_config()
          store = R2ArchiveStore(config)
          store.load_deleted_index()
          url = store.publish_deleted_index(force=True)
          store.flush_usage(force=True)
          count = len(store.deleted_index)
          print(f"Re-published {count:,} deleted bots -> {url}")

          runtime_path = Path('data/runtime.json')
          runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
          runtime['deletedIndexUrl'] = url
          runtime_path.write_text(json.dumps(runtime, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = Path('data/manifest.json')
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              manifest['deletedBots'] = count
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          stats_path = Path('data/stats.json')
          if stats_path.exists():
              stats = json.loads(stats_path.read_text(encoding='utf-8'))
              stats['deletedBots'] = count
              adaptive = stats.setdefault('adaptiveDiscovery', {})
              adaptive['basePages'] = 100
              adaptive['nextPageBudget'] = 100
              stats_path.write_text(json.dumps(stats, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          feed_path = Path('data/archive-feed.json')
          if feed_path.exists():
              feed = json.loads(feed_path.read_text(encoding='utf-8'))
              feed.setdefault('archive', {})['deletedBots'] = count
              feed_path.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-deleted-index-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix deleted index sync and use 100-page maintenance"
          git push origin HEAD:main
