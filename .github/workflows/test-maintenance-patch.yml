name: Test maintenance patch

on:
  push:
    paths:
      - ".github/workflows/test-maintenance-patch.yml"
      - "scripts/r2_archive_maintenance.py"
      - "tests/test_r2_archive_maintenance.py"
      - "config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
