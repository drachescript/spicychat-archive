name: Deploy archive website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "assets/**"
      - "bot/**"
      - "deleted/**"
      - "data/**"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pages-site"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a index.html favicon.svg assets bot deleted data CNAME .nojekyll "$OUT/"

          # Before the one-time R2 migration the site still uses the old local
          # detail/media layout. Rebuild those generated copies only in the Pages
          # artifact so they no longer need to be duplicated in Git afterward.
          if ! python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/runtime.json')
          raise SystemExit(0 if p.exists() and json.loads(p.read_text()).get('storageMode') == 'r2' else 1)
          PY
          then
            mkdir -p "$OUT/data/bots"
            if [ -d archive/bots ]; then
              find archive/bots -type f -name '*.json' -exec cp {} "$OUT/data/bots/" \;
            fi
            if [ -d archive/media ]; then
              mkdir -p "$OUT/media"
              cp -a archive/media/. "$OUT/media/"
            elif [ -d media ]; then
              cp -a media "$OUT/"
            fi
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
